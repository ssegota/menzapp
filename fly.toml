# fly.toml app configuration file generated for menzapp on 2026-05-24T11:36:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'menzapp'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'marendapp_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
